<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Survival V5</title>
<style>
body{font-family:system-ui;background:#0b1020;color:#eee;padding:16px}.wrap{max-width:850px;margin:auto}
.card{background:#151c32;border:1px solid #293252;border-radius:16px;padding:15px;margin:10px 0}
input,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #354263;background:#0d1428;color:white}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{background:#0e1427;padding:10px;border-radius:10px}.v{font-weight:700;font-size:19px}
pre{white-space:pre-wrap;word-break:break-word}.log{padding:8px;background:#10172b;border-radius:8px;margin:6px 0}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style>
<div class=wrap>
<div class=card><h1>🤖 AI Survival V5</h1><p>AI tự tìm website → tự phân tích → tự chọn cơ hội → mô phỏng kết quả.</p>
<input id=url placeholder="Worker URL, ví dụ: https://ten-worker.ten-domain.workers.dev">
<button onclick=step()>🔎 AI tự tìm web & hành động</button><button onclick=auto()>▶️ Tự chạy / Dừng</button><button onclick=reset()>♻️ Reset</button></div>
<div class=card><div class=grid>
<div class=s>Ví<div class=v id=w>100.000đ</div></div><div class=s>Lượt<div class=v id=t>0</div></div>
<div class=s>Ngày<div class=v id=d>1</div></div><div class=s>Kiến thức<div class=v id=k>0</div></div>
</div></div>
<div class=card><h3>🧠 Suy nghĩ</h3><pre id=th>Chưa bắt đầu</pre></div>
<div class=card><h3>🌐 Web AI tự tìm</h3><pre id=fi>Chưa có</pre></div>
<div class=card><h3>⚙️ Hành động</h3><pre id=ac>Chưa có</pre></div>
<div class=card><h3>🧠 Bài học</h3><pre id=le>Chưa có</pre></div>
<div class=card><h3>📜 Nhật ký</h3><div id=lg></div></div>
</div>
<script>
let s={wallet:100000,turn:0,day:1,knowledge:0,memory:[],logs:[]},timer;
const $=id=>document.getElementById(id), money=n=>Math.round(n).toLocaleString("vi-VN")+"đ";
function draw(){$("w").textContent=money(s.wallet);$("t").textContent=s.turn;$("d").textContent=s.day;$("k").textContent=s.knowledge;$("lg").innerHTML=s.logs.slice(-12).reverse().map(x=>"<div class=log>"+x+"</div>").join("")}
function reset(){s={wallet:100000,turn:0,day:1,knowledge:0,memory:[],logs:[]};draw()}
async function step(){
 let u=$("url").value.trim();if(!u)return alert("Dán Worker URL trước.");
 $("th").textContent="AI đang tìm web...";
 try{
  let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:{...s,memory:s.memory.slice(-12)}})});
  let z=await r.json();if(z.error)throw Error(z.error);
  let a=JSON.parse((z.output_text||"").replace(/^```json\s*/,"").replace(/```$/,"").trim());
  $("th").textContent=a.thought||"";$("fi").textContent="Từ khóa: "+a.search_query+"\n\n"+a.findings+"\n\nCơ hội: "+a.opportunity+"\nWebsite: "+a.site;
  $("ac").textContent=a.action+"\n\nChi phí mô phỏng: "+money(a.cost_vnd)+"\nThưởng mô phỏng: "+money(a.reward_vnd)+"\nLý do: "+a.reason;
  $("le").textContent=a.lesson;
  let cost=Math.max(0,Number(a.cost_vnd)||0), reward=Math.max(0,Number(a.reward_vnd)||0), spent=Math.min(cost,s.wallet);
  s.wallet-=spent;s.wallet+=reward;s.turn++;s.knowledge++;s.memory.push({opportunity:a.opportunity,site:a.site,action:a.action,reward,lesson:a.lesson});
  if(s.turn%8===0)s.day++;
  s.logs.push("Lượt "+s.turn+" — "+a.opportunity+" → "+(reward?"+":"")+money(reward)+(spent?" / -"+money(spent):""));
  draw();
 }catch(e){$("th").textContent="❌ "+e.message}
}
function auto(){if(timer){clearInterval(timer);timer=null}else{step();timer=setInterval(step,9000)}}
draw();
</script>
